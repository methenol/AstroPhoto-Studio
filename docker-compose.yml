# AstroPhoto Studio web UI:
#
#   docker compose up -d --build                      # NVIDIA GPU (needs the NVIDIA Container Toolkit)
#   docker compose --profile cpu up -d --build        # CPU only (macOS: containers cannot use the Apple GPU)
#
# The GPU service is the default through COMPOSE_PROFILES=nvidia in .env (copy .env.example);
# --profile cpu replaces it.  Without a .env, name the profile: --profile nvidia.
#
# then open http://localhost:${PORT} (default 8000).  Settings come from the environment or a
# .env file next to this one (see .env.example):
#   IMAGES_DIR   host folder with the session folders, mounted read-only   (default ./images)
#   LIBRARY_DIR  optional second folder, read-only at /data/library (default: IMAGES_DIR)
#   OUTPUT_DIR   host folder for caches, stacks and exports, read-write    (default ./output)
#   PORT         host port                                                  (default 8000)
#   PUID / PGID  user the server runs as (default: the output folder's owner, else 1000:1000);
#                the entrypoint makes the output folder writable for it, then drops root

x-astrophoto: &astrophoto
  ports:
    - "${PORT:-8000}:8000"
  volumes:
    - type: bind
      source: ${IMAGES_DIR:-./images}
      target: /data/images
      read_only: true
    # a second, optional read-only library (e.g. the whole NAS share when IMAGES_DIR is one of its
    # subfolders): reachable in the UI and the API as /data/library/...; defaults to IMAGES_DIR
    - type: bind
      source: ${LIBRARY_DIR:-${IMAGES_DIR:-./images}}
      target: /data/library
      read_only: true
    - type: bind
      source: ${OUTPUT_DIR:-./output}
      target: /data/output
      bind:
        create_host_path: true
  # Siril and the tool subprocesses share memory through /dev/shm
  shm_size: "${SHM_SIZE:-8gb}"
  # stable RC-Astro machine identity: the licence activation is tied to it (licence lives in the volume)
  hostname: astrophoto-studio
  # Siril keeps every frame of a sequence open: thousands of subs need a high open-files limit
  ulimits:
    nofile:
      soft: 1048576
      hard: 1048576
  restart: unless-stopped

# environment of both services:
#   ASTROPHOTO_CALIB          extra calibration library inside the container
#                             (e.g. /data/images/Dwarf/CALI_FRAME), or "off"
#   ASTROPHOTO_*_RAM_GB       RAM budgets per stage, GB (default: from the container's memory)
#   ASTROPHOTO_LOCAL_COPY     (LOCAL_COPY in .env) jobs read the subs from a local copy, deleted after
#   ASTROPHOTO_LOCAL_DIR      (LOCAL_DIR) where that copy goes (default /data/output/.local_copy)

services:
  astrophoto:
    <<: *astrophoto
    profiles: ["nvidia"]
    image: astrophoto-studio:cuda
    build:
      context: .
      # the build runs on the host's network: BuildKit gives build containers the host's
      # resolv.conf unfiltered, and where that lists only IPv6 nameservers (Comcast and others)
      # the default build network, which has no IPv6 route, cannot resolve anything - apt
      # ("Unable to locate package") and pip ("No matching distribution found") both fail.
      # BUILD_NETWORK=default restores the old behaviour (e.g. a buildx builder without the
      # network.host entitlement)
      network: ${BUILD_NETWORK:-host}
      args:
        GRAXPERT_EXTRA: cuda
        STARNET_ACCEPT_LICENSE: "${STARNET_ACCEPT_LICENSE:-}"
    environment:
      ASTROPHOTO_DEVICE: "${ASTROPHOTO_DEVICE:-auto}"
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      ASTROPHOTO_CALIB: "${ASTROPHOTO_CALIB:-}"
      ASTROPHOTO_STACK_RAM_GB: "${ASTROPHOTO_STACK_RAM_GB:-}"
      ASTROPHOTO_PREP_RAM_GB: "${ASTROPHOTO_PREP_RAM_GB:-}"
      ASTROPHOTO_RAW_CACHE_GB: "${ASTROPHOTO_RAW_CACHE_GB:-}"
      ASTROPHOTO_LOCAL_COPY: "${LOCAL_COPY:-false}"
      ASTROPHOTO_LOCAL_DIR: "${LOCAL_DIR:-}"
      STARNET_ACCEPT_LICENSE: "${STARNET_ACCEPT_LICENSE:-}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: "${GPU_COUNT:-all}"
              capabilities: [gpu]

  astrophoto-cpu:
    <<: *astrophoto
    profiles: ["cpu"]
    image: astrophoto-studio:cpu
    build:
      context: .
      network: ${BUILD_NETWORK:-host}   # see the GPU service
      args:
        GRAXPERT_EXTRA: cpuonly
        STARNET_ACCEPT_LICENSE: "${STARNET_ACCEPT_LICENSE:-}"
    environment:
      ASTROPHOTO_DEVICE: cpu
      PUID: "${PUID:-}"
      PGID: "${PGID:-}"
      ASTROPHOTO_CALIB: "${ASTROPHOTO_CALIB:-}"
      ASTROPHOTO_STACK_RAM_GB: "${ASTROPHOTO_STACK_RAM_GB:-}"
      ASTROPHOTO_PREP_RAM_GB: "${ASTROPHOTO_PREP_RAM_GB:-}"
      ASTROPHOTO_RAW_CACHE_GB: "${ASTROPHOTO_RAW_CACHE_GB:-}"
      ASTROPHOTO_LOCAL_COPY: "${LOCAL_COPY:-false}"
      ASTROPHOTO_LOCAL_DIR: "${LOCAL_DIR:-}"
      STARNET_ACCEPT_LICENSE: "${STARNET_ACCEPT_LICENSE:-}"
